name: 'CS2 with base files (SwiftlyS2)'
author: alext303@gmail.com
description: |-
  Egg for start server with one instance game files
  Create mount 
  source: /home/cs2_base/server
  target: /mnt
image: null
tags:
  - 'Counter Strike 2'
features:
  - 'low space'
  - cs2
docker_images:
  ServUp_BaseFiles: 'docker.io/scrender/base-files-cs2:latest'
  ServUp_BaseFiles_DEV: 'docker.io/scrender/base-files-cs2:dev'
file_denylist: {  }
startup_commands:
  Default: './game/cs2.sh -dedicated -strictportbind +ip $( [ "$RCON_ENABLED" == "1" ] && printf ''%s'' ''0.0.0.0'' || printf ''%s'' ''{{SERVER_IP}}'' ) -port {{SERVER_PORT}} +map {{SRCDS_MAP}} -maxplayers {{SRCDS_MAXPLAYERS}} -maxplayers_override {{SRCDS_MAXPLAYERS}} -norestart $( [ "$VAC_ENABLED" == "1" ] && printf ''%s'' ''-secure'' || printf ''%s'' ''-insecure'' ) $( [ "$BOTS_ENABLED" == "1" ] || printf ''%s'' '' -nobots'' ) $( [ "$RCON_ENABLED" == "1" ] || printf ''%s'' '' -usercon'' ) $( [ "$TV_ENABLED" == "1" ] && printf ''%s'' " +tv_enable 1 +tv_port $((SERVER_PORT + 1001)) +tv_maxclients {{TV_MAX_CLIENTS}} +tv_delay {{TV_DELAY}} +tv_name {{TV_NAME}} +tv_relayvoice 1 +tv_delaymapchange 1" ) $( [ -n "{{STEAM_ACC}}" ] && printf ''%s'' " +sv_setsteamaccount {{STEAM_ACC}}" ) +game_type {{GAME_TYPE}} +game_mode {{GAME_MODE}} $( [ -n "{{WORKSHOP_MAP_ID}}" ] && printf ''%s'' " +host_workshop_map {{WORKSHOP_MAP_ID}}" ) $( [ -n "{{WORKSHOP_COLLECTIONS_ID}}" ] && printf ''%s'' " +host_workshop_collection {{WORKSHOP_COLLECTIONS_ID}}" ) $( [ -n "{{MAP_GROUP}}" ] && printf ''%s'' " +mapgroup {{MAP_GROUP}}" ) +servercfgfile {{CFG_FILE}} {{CUSTOM_PARAMS}} $( [ "$DEBUG" == "0" ] || printf ''%s'' '' -debug'' )'
config:
  files:
    'game/csgo/cfg/{{CFG_FILE}}':
      parser: file
      find:
        rcon_password: 'rcon_password "{{env.RCON_PASSWORD}}"'
        hostname: 'hostname "{{env.HOST_NAME}}"'
        sv_tags: 'sv_tags "{{env.SERVER_TAGS}}"'
  startup:
    done: 'Connection to Steam servers successful'
  logs: {  }
  stop: quit
scripts:
  installation:
    script: |-
      #!/bin/bash

      echo "Start installing"
    container: 'ghcr.io/pelican-eggs/installers:debian'
    entrypoint: bash
